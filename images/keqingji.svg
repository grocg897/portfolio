<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <rect width="1200" height="675" fill="#f4f1ea"/>
  <circle cx="90" cy="600" r="160" fill="#efeadd"/>
  <circle cx="1120" cy="80" r="120" fill="#efeadd"/>

  <!-- 手机屏：记账 App -->
  <rect x="120" y="87" width="380" height="500" rx="36" fill="#ffffff" stroke="#ddd5c6" stroke-width="2"/>
  <rect x="250" y="103" width="120" height="18" rx="9" fill="#f4f1ea"/>
  <text x="160" y="180" font-size="22" fill="#8a8378">本月支出</text>
  <text x="160" y="228" font-size="46" font-weight="700" fill="#161310">¥ 2,468.50</text>

  <g font-size="19" fill="#4b4640">
    <rect x="160" y="264" width="300" height="58" rx="14" fill="#faf8f3"/>
    <rect x="176" y="280" width="26" height="26" rx="8" fill="#fde7e0"/>
    <path d="M182 293h14m-7-7v14" stroke="#e8472d" stroke-width="2.5" stroke-linecap="round"/>
    <text x="216" y="300">餐饮 · 午餐</text>
    <text x="418" y="300" text-anchor="end" font-weight="600" fill="#161310">-¥28</text>

    <rect x="160" y="334" width="300" height="58" rx="14" fill="#faf8f3"/>
    <rect x="176" y="350" width="26" height="26" rx="8" fill="#e3efe7"/>
    <circle cx="189" cy="363" r="9" fill="none" stroke="#3d9a6b" stroke-width="2.5"/>
    <text x="216" y="370">交通 · 地铁</text>
    <text x="418" y="370" text-anchor="end" font-weight="600" fill="#161310">-¥6</text>

    <rect x="160" y="404" width="300" height="58" rx="14" fill="#faf8f3"/>
    <rect x="176" y="420" width="26" height="26" rx="8" fill="#eef0f6"/>
    <rect x="181" y="425" width="16" height="16" rx="3" fill="none" stroke="#5b6b9e" stroke-width="2.5"/>
    <text x="216" y="440">购物 · 日用品</text>
    <text x="418" y="440" text-anchor="end" font-weight="600" fill="#161310">-¥86</text>
  </g>

  <!-- 语音记账气泡 -->
  <rect x="160" y="480" width="222" height="44" rx="22" fill="#e3efe7"/>
  <circle cx="186" cy="502" r="11" fill="#3d9a6b"/>
  <path d="M181 502h10m-3-4 4 4-4 4" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <text x="206" y="509" font-size="17" fill="#2f7a53">语音记账：打车 32 元</text>

  <!-- 右侧统计卡片 -->
  <rect x="560" y="120" width="330" height="300" rx="24" fill="#ffffff" stroke="#ddd5c6" stroke-width="2"/>
  <text x="592" y="172" font-size="22" font-weight="600" fill="#161310">月度收支统计</text>
  <g>
    <rect x="596" y="330" width="34" height="52" rx="6" fill="#fde7e0"/>
    <rect x="648" y="300" width="34" height="82" rx="6" fill="#f8cfc2"/>
    <rect x="700" y="262" width="34" height="120" rx="6" fill="#e8472d"/>
    <rect x="752" y="286" width="34" height="96" rx="6" fill="#f8cfc2"/>
    <rect x="804" y="316" width="34" height="66" rx="6" fill="#fde7e0"/>
    <rect x="856" y="340" width="34" height="42" rx="6" fill="#f4ede2"/>
  </g>
  <line x1="592" y1="384" x2="858" y2="384" stroke="#ddd5c6" stroke-width="2"/>
  <g font-size="14" fill="#8a8378" text-anchor="middle">
    <text x="613" y="404">4月</text><text x="665" y="404">5月</text><text x="717" y="404">6月</text>
    <text x="769" y="404">7月</text><text x="821" y="404">8月</text><text x="873" y="404">9月</text>
  </g>

  <!-- 预算提醒卡 -->
  <rect x="560" y="452" width="330" height="88" rx="20" fill="#fde7e0"/>
  <circle cx="606" cy="496" r="20" fill="#e8472d"/>
  <path d="M598 496l6 6 11-12" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="642" y="490" font-size="19" font-weight="600" fill="#161310">预算提醒</text>
  <text x="642" y="516" font-size="16" fill="#4b4640">本月餐饮预算已使用 78%</text>

  <!-- 云开发标识 -->
  <g transform="translate(950,470)">
    <rect width="176" height="70" rx="16" fill="#ffffff" stroke="#ddd5c6" stroke-width="2"/>
    <path d="M36 44a12 12 0 1 1 3-23 16 16 0 0 1 30-4 11 11 0 0 1 3 27z" fill="none" stroke="#5b6b9e" stroke-width="2.5" stroke-linejoin="round" transform="translate(-2,-8)"/>
    <text x="78" y="42" font-size="17" fill="#4b4640">微信云开发</text>
  </g>
</svg>
